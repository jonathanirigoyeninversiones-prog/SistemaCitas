<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>11 Historial Médico Avanzado</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #login-layer { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        .controls { margin-bottom: 20px; padding: 15px; background: #f4f4f4; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .btn-danger { background-color: #dc3545; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="login-layer">
        <h2>Acceso Historial</h2>
        <input type="email" id="email" placeholder="Correo">
        <input type="password" id="pass" placeholder="Clave">
        <button onclick="login()">Ingresar</button>
    </div>

    <div id="historial-content" style="display:none;">
        <h1>Reportes de Citas</h1>
        <div class="controls">
            <input type="date" id="fechaInicio">
            <input type="date" id="fechaFin">
            <select id="filtroMedico"><option value="">Todos los médicos</option></select>
            <input type="text" id="filtroCedula" placeholder="Filtrar Cédula o Doctor..." oninput="generarReporte()">
            <button onclick="generarReporte()">Filtrar</button>
            <button onclick="borrarCitasSeleccionadas()" class="btn-danger">Borrar Rango Seleccionado</button>
            <button onclick="cargarDatos()">Refrescar</button>
        </div>
        <table id="tabla-reporte">
            <thead id="head-reporte"></thead>
            <tbody id="lista-reporte"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE", authDomain: "sistemagestionnegocios-33fef.firebaseapp.com", projectId: "sistemagestionnegocios-33fef", storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app", messagingSenderId: "1070762032731", appId: "1:1070762032731:web:74ad150e739181c8d0897e" }));
        let historialCompleto = [];
        let medicos = [];

        window.cargarDatos = async () => {
            const snap = await getDocs(collection(db, "historial_citas"));
            historialCompleto = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const mSnap = await getDocs(collection(db, "medicos"));
            medicos = mSnap.docs.map(d => d.data());
            
            const sel = document.getElementById("filtroMedico");
            medicos.forEach(m => sel.innerHTML += `<option value="${m.Nombre}">${m.Nombre}</option>`);
            generarReporte();
        };

        window.borrarCitasSeleccionadas = async () => {
            const fInicio = document.getElementById("fechaInicio").value;
            const fFin = document.getElementById("fechaFin").value;
            const medico = document.getElementById("filtroMedico").value;
            
            if(!confirm(`¿Seguro que deseas borrar las citas ${medico ? 'del Dr. ' + medico : 'de todos los médicos'} entre ${fInicio} y ${fFin}?`)) return;

            const citasABorrar = historialCompleto.filter(c => {
                const cumpleFecha = (!fInicio || c.fecha >= fInicio) && (!fFin || c.fecha <= fFin);
                const cumpleMedico = !medico || c.doctor === medico;
                return cumpleFecha && cumpleMedico;
            });

            for(const cita of citasABorrar) {
                await deleteDoc(doc(db, "historial_citas", cita.id));
            }
            alert("Citas eliminadas: " + citasABorrar.length);
            cargarDatos();
        };

        window.login = async () => {
            try {
                await signInWithEmailAndPassword(getAuth(), document.getElementById("email").value, document.getElementById("pass").value);
                document.getElementById("login-layer").style.display = "none";
                document.getElementById("historial-content").style.display = "block";
                await cargarDatos();
            } catch (e) { alert("Error: " + e.message); }
        };

        window.generarReporte = () => {
            const tbody = document.getElementById("lista-reporte");
            tbody.innerHTML = "";
            const filtro = document.getElementById("filtroCedula").value.toLowerCase().replace(/\./g, '');
            
            historialCompleto.filter(c => (c.cedula && c.cedula.toLowerCase().includes(filtro)) || (c.doctor && c.doctor.toLowerCase().includes(filtro))).forEach(c => {
                const cedulaFormateada = parseInt(c.cedula).toLocaleString('es-VE');
                tbody.innerHTML += `<tr><td>${c.nombre}</td><td>${cedulaFormateada}</td><td>${c.doctor}</td><td>${c.fecha}</td></tr>`;
            });
        };

        window.login();
    </script>
</body>
</html>
