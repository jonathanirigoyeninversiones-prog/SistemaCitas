<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>mmm Historial Médico Avanzado</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #login-layer { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        .controls { margin-bottom: 20px; padding: 15px; background: #f4f4f4; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <div id="login-layer">
        <h2>Acceso Historial</h2>
        <input type="email" id="email" placeholder="Correo">
        <input type="password" id="pass" placeholder="Clave">
        <button onclick="login()">Ingresar</button>
    </div>

    <div id="historial-content" style="display:none;">
        <h1>Reportes de Citas</h1>
        <div class="controls">
            <input type="date" id="fechaInicio">
            <input type="date" id="fechaFin">
            <input type="text" id="filtroCedula" placeholder="Filtrar por Cédula..." oninput="generarReporte()">
            <select id="tipoReporte" onchange="actualizarSeleccion()">
                <option value="todosMedicos">Resumen por Médico</option>
                <option value="todosPacientes">Detalle de Pacientes</option>
                <option value="canceladas">Citas Canceladas</option>
            </select>
            <button onclick="generarReporte()">Generar Reporte</button>
            <button onclick="cargarDatos()">Refrescar Datos</button>
        </div>
        <table id="tabla-reporte">
            <thead id="head-reporte"></thead>
            <tbody id="lista-reporte"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE", authDomain: "sistemagestionnegocios-33fef.firebaseapp.com", projectId: "sistemagestionnegocios-33fef", storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app", messagingSenderId: "1070762032731", appId: "1:1070762032731:web:74ad150e739181c8d0897e" }));
        let historialCompleto = [];
        let canceladasCompleto = [];
        let medicos = [];

        window.cargarDatos = async () => {
            const snap = await getDocs(collection(db, "historial_citas"));
            historialCompleto = snap.docs.map(d => d.data());
            const cSnap = await getDocs(collection(db, "citas_canceladas"));
            canceladasCompleto = cSnap.docs.map(d => d.data());
            const mSnap = await getDocs(collection(db, "medicos"));
            medicos = mSnap.docs.map(d => ({id: d.id, ...d.data()}));
            generarReporte();
        };

        window.login = async () => {
            try {
                await signInWithEmailAndPassword(getAuth(), document.getElementById("email").value, document.getElementById("pass").value);
                document.getElementById("login-layer").style.display = "none";
                document.getElementById("historial-content").style.display = "block";
                await cargarDatos();
                setInterval(cargarDatos, 60000);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.generarReporte = () => {
            const tbody = document.getElementById("lista-reporte");
            const thead = document.getElementById("head-reporte");
            tbody.innerHTML = "";
            const tipo = document.getElementById("tipoReporte").value;
            
            if (tipo === "todosPacientes") {
                thead.innerHTML = "<tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Doctor</th><th>Día</th><th>Fecha</th><th>Hora</th><th>Precio USD</th><th>Precio Bs</th><th>Pago Médico (Bs)</th></tr>";
                historialCompleto.forEach(c => {
                    const m = medicos.find(med => med.Nombre === c.doctor) || {porcentaje: 60};
                    const precioBs = parseFloat(c.precioBs.toString().replace(/[^0-9.]/g, '')) || 0;
                    const pagoMedico = (precioBs * (m.porcentaje / 100)).toLocaleString('es-VE', {minimumFractionDigits: 2});
                    tbody.innerHTML += `<tr><td>${c.nombre}</td><td>${c.cedula}</td><td>${c.telefono}</td><td>${c.doctor}</td><td>${c.dia}</td><td>${c.fecha}</td><td>${c.hora}</td><td>$${c.precioUSD}</td><td>${c.precioBs}</td><td>${pagoMedico} Bs</td></tr>`;
                });
            } else if (tipo === "canceladas") {
                thead.innerHTML = "<tr><th>Nombre</th><th>Cédula</th><th>Doctor</th><th>Fecha Cita</th><th>Fecha Cancelación</th></tr>";
                canceladasCompleto.forEach(c => {
                    tbody.innerHTML += `<tr><td>${c.nombre}</td><td>${c.cedula}</td><td>${c.doctor}</td><td>${c.fecha}</td><td>${c.fechaCancelacion ? c.fechaCancelacion.split('T')[0] : ''}</td></tr>`;
                });
            } else {
                thead.innerHTML = "<tr><th>Doctor</th><th>Total Citas</th><th>Comisión (%)</th><th>Total Pago Médico (Bs)</th></tr>";
                medicos.forEach(m => {
                    const citas = historialCompleto.filter(c => c.doctor === m.Nombre);
                    const totalBs = citas.reduce((acc, c) => acc + (parseFloat(c.precioBs.toString().replace(/[^0-9.]/g, '')) || 0), 0);
                    const porcentaje = m.porcentaje || 60;
                    const totalPago = (totalBs * (porcentaje / 100)).toLocaleString('es-VE', {minimumFractionDigits: 2});
                    tbody.innerHTML += `<tr><td>${m.Nombre}</td><td>${citas.length}</td><td>${porcentaje}%</td><td>${totalPago} Bs</td></tr>`;
                });
            }
        };

        window.actualizarSeleccion = generarReporte;
        window.login();
    </script>
</body>
</html>
