<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Citas</title>
</head>
<body>
    <h1>🏥 Reserva tu Cita</h1>
    <nav id="nav-especialidades"></nav>
    <div id="seccion-seleccion">Cargando sistema...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // Inicialización segura
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
                authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
                projectId: "sistemagestionnegocios-33fef",
                storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
                messagingSenderId: "1070762032731",
                appId: "1:1070762032731:web:74ad150e739181c8d0897e"
            };
            
            const db = getFirestore(initializeApp(firebaseConfig));
            const cont = document.getElementById("seccion-seleccion");

            async function init() {
                try {
                    const snap = await getDocs(collection(db, "medicos"));
                    const medicos = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    
                    if(medicos.length === 0) {
                        cont.innerHTML = "No hay médicos registrados.";
                        return;
                    }

                    const nav = document.getElementById("nav-especialidades");
                    nav.innerHTML = "";
                    const especialidades = [...new Set(medicos.map(m => m.especialidad))];
                    
                    especialidades.forEach(esp => {
                        const b = document.createElement("button");
                        b.innerText = esp;
                        b.onclick = () => alert("Especialidad: " + esp);
                        nav.appendChild(b);
                    });
                    cont.innerHTML = "Selecciona una especialidad arriba.";
                } catch (err) {
                    cont.innerHTML = "Error cargando datos: " + err.message;
                }
            }

            init();
        } catch (err) {
            document.body.innerHTML = "<h1>Error crítico:</h1><p>" + err.message + "</p>";
        }
    </script>
</body>
</html>
