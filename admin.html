<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Clínica</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .btn-ws { background: #25D366; color: white; border: none; padding: 5px 10px; cursor: pointer; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Panel de Control de Citas</h1>
    <button onclick="location.reload()">Actualizar Lista</button>
    <br><br>
    <table>
        <thead>
            <tr>
                <th>Paciente</th>
                <th>Teléfono</th>
                <th>Doctor</th>
                <th>Fecha/Hora</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="lista-citas"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        async function cargarCitas() {
            const querySnapshot = await getDocs(collection(db, "citas"));
            const tbody = document.getElementById("lista-citas");
            tbody.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const c = doc.data();
                tbody.innerHTML += `<tr>
                    <td>${c.paciente}</td>
                    <td>${c.telefonoPaciente}</td>
                    <td>${c.doctor}</td>
                    <td>${c.dia} - ${c.hora}</td>
                    <td><a href="https://wa.me/${c.telefonoPaciente}" class="btn-ws" target="_blank">Contactar WhatsApp</a></td>
                </tr>`;
            });
        }
        cargarCitas();
    </script>
</body>
</html>
