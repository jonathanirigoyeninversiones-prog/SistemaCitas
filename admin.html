<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #333; color: white; }
    </style>
</head>
<body>
    <h1>Citas Pendientes</h1>
    
    <input type="text" id="buscar" placeholder="Buscar (nombre, cédula, etc)" onkeyup="filtrarTabla()">
    <button onclick="cargarCitas()">Refrescar Lista</button>

    <table>
        <thead>
            <tr>
                <th>Nombre y Apellido</th>
                <th>Cédula</th>
                <th>Teléfono</th>
                <th>Cita</th>
                <th>Fecha</th> <!-- Columna añadida -->
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="lista-citas"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        async function cargarCitas() {
            const tbody = document.getElementById("lista-citas");
            const snap = await getDocs(collection(db, "citas"));
            tbody.innerHTML = "";
            snap.forEach(doc => {
                const c = doc.data();
                tbody.innerHTML += `<tr>
                    <td>${c.nombre || ''}</td>
                    <td>${c.cedula || ''}</td>
                    <td>${c.telefono || ''}</td>
                    <td>${c.doctor || ''} - ${c.hora || ''}</td>
                    <td>${c.fecha || 'Sin fecha'}</td>
                    <td>
                        <button onclick="window.open('https://wa.me/${c.telefono}')">WhatsApp</button>
                        <button onclick="alert('Funcionalidad Cancelar')">Cancelar</button>
                    </td>
                </tr>`;
            });
        }

        // Búsqueda
        window.filtrarTabla = () => {
            const filtro = document.getElementById("buscar").value.toUpperCase();
            const filas = document.getElementById("lista-citas").getElementsByTagName("tr");
            for (let f of filas) {
                f.style.display = f.innerText.toUpperCase().includes(filtro) ? "" : "none";
            }
        };

        // Cargar al iniciar y refrescar cada 60 segundos
        window.cargarCitas = cargarCitas;
        window.addEventListener("DOMContentLoaded", cargarCitas);
        setInterval(cargarCitas, 60000); 
    </script>
</body>
</html>
