<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #login-layer { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        #admin-content, #historial-content { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #333; color: white; padding: 10px; cursor: pointer; }
        td { border: 1px solid #ddd; padding: 10px; }
        .btn-confirm { background-color: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-cumplido { background-color: #007bff; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-cancel { background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-refresh { background-color: #6c757d; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-left: 10px; }
        .badge-confirmado { background-color: #28a745; color: white; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        #buscador { margin-bottom: 15px; padding: 10px; width: 300px; }
        .filtros-historial { margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="login-layer">
        <h2>Acceso Administrador</h2>
        <input type="text" id="user" placeholder="Usuario"><br><br>
        <input type="password" id="pass" placeholder="Clave"><br><br>
        <button onclick="validar()">Ingresar</button>
    </div>

    <div id="admin-content">
        <h1>Citas Pendientes</h1>
        <button onclick="mostrarHistorial()">Ver Historial</button>
        <button class="btn-refresh" onclick="cargarCitas()">Refrescar</button>
        <input type="text" id="buscador" placeholder="Filtrar por cédula..." onkeyup="filtrarTabla()">
        <table>
            <thead>
                <tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Cita</th><th onclick="alternarOrden()">Fecha ↕</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="lista-citas"></tbody>
        </table>
    </div>

    <div id="historial-content">
        <h1>Historial de Citas Cumplidas</h1>
        <button onclick="volverPendientes()">Volver a Pendientes</button>
        
        <div class="filtros-historial">
            <select id="filtro-doctor" onchange="mostrarHistorial()">
                <option value="todos">TODOS</option>
                <option value="Juan Perez">Dr. Juan Perez</option>
                <option value="pedro el escamoso">Pedro el escamoso</option>
            </select>
            <input type="date" id="fecha-inicio" onchange="mostrarHistorial()">
            <input type="date" id="fecha-fin" onchange="mostrarHistorial()">
            <span id="contador-citas" style="margin-left: 20px; font-weight: bold;"></span>
        </div>

        <table>
            <thead>
                <tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Doctor</th><th>Fecha</th></tr>
            </thead>
            <tbody id="lista-historial"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        let listaCitas = [];
        let ordenAscendente = true;

        const formatearCedula = (ced) => {
            let s = ced.toString().replace(/\D/g, '');
            return s.replace(/(\d{1,3})(\d{3})(\d{3})/, '$1.$2.$3');
        };

        const formatearFecha = (f) => {
            if (!f || !f.includes('-')) return f;
            const partes = f.split('-');
            if (partes[0].length === 4) return `${partes[2]}-${partes[1]}-${partes[0]}`;
            return f;
        };

        window.alternarOrden = () => {
            ordenAscendente = !ordenAscendente;
            renderizarTabla(listaCitas);
        };

        window.filtrarTabla = () => {
            const busqueda = document.getElementById("buscador").value.toLowerCase();
            const filtrados = listaCitas.filter(c => (c.cedula || '').toString().toLowerCase().includes(busqueda));
            renderizarTabla(filtrados);
        };

        window.validar = async () => {
            const u = document.getElementById("user").value.trim();
            const p = document.getElementById("pass").value.trim();
            const docSnap = await getDoc(doc(db, "configuracion", "credenciales_admin"));
            if (docSnap.exists() && docSnap.data().usuario.toString().trim() === u && docSnap.data().clave.toString().trim() === p) {
                document.getElementById("login-layer").style.display = "none";
                document.getElementById("admin-content").style.display = "block";
                cargarCitas();
            } else { alert("Credenciales incorrectas"); }
        };

        window.cargarCitas = async () => {
            const snap = await getDocs(collection(db, "citas"));
            listaCitas = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderizarTabla(listaCitas);
        };

        function renderizarTabla(data) {
            const tbody = document.getElementById("lista-citas");
            tbody.innerHTML = "";
            [...data].sort((a,b) => ordenAscendente ? new Date(a.fecha)-new Date(b.fecha) : new Date(b.fecha)-new Date(a.fecha)).forEach(c => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${c.nombre||''}</td><td>${formatearCedula(c.cedula||'')}</td><td>${c.telefono||''}</td><td>${c.doctor||''} - ${c.hora||''}</td><td>${formatearFecha(c.fecha||'')}</td><td>${c.confirmado?'<span class="badge-confirmado">Confirmado</span>':'Pendiente'}</td><td>${!c.confirmado?`<button class="btn-confirm" onclick="confirmar('${c.id}')">Confirmar</button>`:''}<button class="btn-cumplido" onclick="marcarCumplido('${c.id}')">Cumplido</button><button class="btn-cancel" onclick="cancelar('${c.id}')">Cancelar</button></td>`;
                tbody.appendChild(tr);
            });
        }

        window.marcarCumplido = async (id) => {
            const cita = listaCitas.find(c => c.id === id);
            await addDoc(collection(db, "historial_citas"), { ...cita, fechaCumplido: new Date().toISOString() });
            await deleteDoc(doc(db, "citas", id));
            cargarCitas();
        };

        window.mostrarHistorial = async () => {
            document.getElementById("admin-content").style.display = "none";
            document.getElementById("historial-content").style.display = "block";
            
            const filtroDoctor = document.getElementById("filtro-doctor").value;
            const fInicio = document.getElementById("fecha-inicio").value;
            const fFin = document.getElementById("fecha-fin").value;
            
            const snap = await getDocs(collection(db, "historial_citas"));
            const tbody = document.getElementById("lista-historial");
            tbody.innerHTML = "";
            let contador = 0;

            snap.forEach(d => {
                const c = d.data();
                const doctorBase = (c.doctor || '').replace("Dr. ", "");
                const fechaCita = c.fecha;
                
                const cumpleDoctor = (filtroDoctor === "todos" || doctorBase === filtroDoctor);
                const cumpleFecha = (!fInicio || fechaCita >= fInicio) && (!fFin || fechaCita <= fFin);

                if (cumpleDoctor && cumpleFecha) {
                    tbody.innerHTML += `<tr><td>${c.nombre}</td><td>${formatearCedula(c.cedula||'')}</td><td>${c.telefono}</td><td>${c.doctor}</td><td>${formatearFecha(c.fecha||'')}</td></tr>`;
                    contador++;
                }
            });
            document.getElementById("contador-citas").innerText = `Total: ${contador} citas`;
        };

        window.volverPendientes = () => {
            document.getElementById("admin-content").style.display = "block";
            document.getElementById("historial-content").style.display = "none";
        };

        window.confirmar = async (id) => { await updateDoc(doc(db, "citas", id), { confirmado: true }); cargarCitas(); };
        window.cancelar = async (id) => { if(confirm("¿Eliminar cita?")) { await deleteDoc(doc(db, "citas", id)); cargarCitas(); } };
    </script>
</body>
</html>
