<button onclick="cargarCitas()">Refrescar Lista</button>

<script type="module">
    // ... (mantén el resto del código igual hasta llegar a cargarCitas)

    // Esta función ahora solo limpia y trae los datos nuevos, sin recargar la web
    async function cargarCitas() {
        const tbody = document.getElementById("lista-citas");
        tbody.innerHTML = "<tr><td colspan='4'>Cargando...</td></tr>"; // Feedback visual
        
        const snap = await getDocs(collection(db, "citas"));
        tbody.innerHTML = ""; // Limpiamos la tabla
        
        snap.forEach(d => {
            const c = d.data();
            tbody.innerHTML += `<tr>
                <td>${c.paciente}</td>
                <td>${c.telefonoPaciente}</td>
                <td>${c.doctor} - ${c.dia} ${c.hora}</td>
                <td>
                    <a href="https://wa.me/${c.telefonoPaciente}" target="_blank" class="btn-ws">Contactar Paciente</a>
                    <button class="btn-del" onclick="eliminar('${d.id}')">Cancelar</button>
                </td>
            </tr>`;
        });
    }

    // ... (el resto del código igual)
</script>
