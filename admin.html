<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
</head>
<body>
    <h1>Citas Pendientes</h1>
    <table>
        <thead>
            <tr>
                <th>Paciente</th>
                <th>Detalles de la Cita</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="lista-citas"></tbody>
    </table>

    <script type="module">
        // ... importaciones y base de datos ...

        window.renderizarTabla = (datos) => {
            const tbody = document.getElementById("lista-citas");
            tbody.innerHTML = "";
            
            datos.forEach(c => {
                // Aquí capturamos la fecha. Si no existe, mostrará "Sin fecha"
                const fechaMostrar = c.fecha || "Sin fecha especificada";
                
                tbody.innerHTML += `
                    <tr>
                        <td>${c.nombre}</td>
                        <td>
                            <strong>Dr. ${c.doctor}</strong><br>
                            ${c.dia} - ${c.hora}<br>
                            <small>Fecha: ${fechaMostrar}</small>
                        </td>
                        <td>${c.confirmado ? '✅' : 'Pendiente'}</td>
                    </tr>
                `;
            });
        };
    </script>
</body>
</html>
