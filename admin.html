<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo - Clínica</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #333; color: white; }
        .btn-confirm { background: #007bff; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 4px; }
        .btn-del { background: #dc3545; color: white; border: none; padding: 8px; cursor: pointer; margin-left: 5px; }
        .check { color: green; font-weight: bold; }
        #login-box { text-align: center; margin-top: 50px; }
    </style>
</head>
<body>
    <div id="login-box">
        <h2>Acceso Administrativo</h2>
        <input type="text" id="user" placeholder="Usuario"><br>
        <input type="password" id="pass" placeholder="Contraseña"><br><br>
        <button onclick="verificar()">Entrar</button>
    </div>

    <div id="panel" style="display:none;">
        <h1>Citas Pendientes</h1>
        <p>El panel se actualiza automáticamente cada minuto.</p>
        <input type="text" id="filtro" onkeyup="filtrarTabla()" placeholder="Buscar (nombre, cédula, etc)...">
        <button onclick="cargarCitas()">Forzar Refresco Ahora</button>
        <table>
            <thead>
                <tr><th>Nombre y Apellido</th><th>Cédula</th><th>Teléfono</th><th>Cita</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="lista-citas"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        window.verificar = async () => {
            const u = document.getElementById("user").value;
            const p = document.getElementById("pass").value;
            const creds = await getDoc(doc(db, "configuracion", "credenciales_admin"));
            
            if (creds.exists() && u === creds.data().usuario && p === creds.data().clave) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("panel").style.display = "block";
                cargarCitas();
                // Activar actualización automática cada 60 segundos
                setInterval(cargarCitas, 60000); 
            } else { 
                alert("Usuario o clave incorrectos"); 
            }
        };

        window.cargarCitas = async () => {
            const tbody = document.getElementById("lista-citas");
            const snap = await getDocs(collection(db, "citas"));
            tbody.innerHTML = "";
            snap.forEach(d => {
                const c = d.data();
                const confirmado = c.confirmado === true;
                tbody.innerHTML += `<tr>
                    <td>${c.nombre} ${c.apellido}</td>
                    <td>${c.cedula}</td>
                    <td>${c.telefono}</td>
                    <td>${c.doctor} - ${c.dia} ${c.hora}</td>
                    <td class="check">${confirmado ? '✅ Confirmado' : 'Pendiente'}</td>
                    <td>
                        ${!confirmado ? `<button class="btn-confirm" onclick="confirmar('${d.id}')">Confirmar</button>` : ''}
                        <button class="btn-del" onclick="eliminar('${d.id}')">Cancelar</button>
                    </td>
                </tr>`;
            });
        };

        window.confirmar = async (id) => {
            await updateDoc(doc(db, "citas", id), { confirmado: true });
            cargarCitas();
        };

        window.filtrarTabla = () => {
            const busqueda = document.getElementById("filtro").value.toLowerCase();
            document.querySelectorAll("#lista-citas tr").forEach(fila => {
                fila.style.display = fila.innerText.toLowerCase().includes(busqueda) ? "" : "none";
            });
        };

        window.eliminar = async (id) => {
            if (confirm("¿Estás seguro de cancelar esta cita?")) { 
                await deleteDoc(doc(db, "citas", id)); 
                cargarCitas(); 
            }
        };
    </script>
</body>
</html>
