
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Recepción</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #login-layer { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        #admin-content { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #333; color: white; padding: 10px; }
        td { border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
    <div id="login-layer">
        <h2>Acceso Recepción</h2>
        <input type="email" id="email" placeholder="Correo (recepcion@clinica.com)"><br><br>
        <input type="password" id="pass" placeholder="Clave"><br><br>
        <button onclick="login()">Ingresar</button>
    </div>

    <div id="admin-content">
        <h1>Citas Pendientes</h1>
        <table id="tabla-citas">
            <thead><tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Cita</th><th>Acciones</th></tr></thead>
            <tbody id="lista-citas"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE", authDomain: "sistemagestionnegocios-33fef.firebaseapp.com", projectId: "sistemagestionnegocios-33fef", storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app", messagingSenderId: "1070762032731", appId: "1:1070762032731:web:74ad150e739181c8d0897e" }));
        const auth = getAuth();

        window.login = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("pass").value);
                document.getElementById("login-layer").style.display = "none";
                document.getElementById("admin-content").style.display = "block";
                const snap = await getDocs(collection(db, "citas"));
                // ... Aquí va tu lógica de renderizado de tabla (se mantiene igual)
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
