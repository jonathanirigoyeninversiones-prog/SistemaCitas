<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Recepción</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #login-layer { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        #admin-content { display: none; }
        #tasa-control { position: absolute; top: 10px; right: 10px; background: #f8f9fa; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .estado-confirmado { background-color: green; color: white; font-weight: bold; }
        .btn { cursor: pointer; padding: 5px; margin: 2px; }
    </style>
</head>
<body>
    <div id="login-layer">
        <h2>Acceso Recepción</h2>
        <input type="email" id="email" placeholder="Correo">
        <input type="password" id="pass" placeholder="Clave">
        <button onclick="login()">Ingresar</button>
    </div>

    <div id="admin-content">
        <div id="tasa-control">
            Tasa BCV: <input type="number" id="tasa-bcv" value="0" step="0.01"> 
            <button onclick="guardarTasa()">Aceptar</button>
            <button onclick="cargarCitas()">Refrescar</button>
        </div>
        <h1>Citas Pendientes</h1>
        <table id="tabla-citas">
            <thead>
                <tr>
                    <th>Nombre</th><th>Cédula</th><th>Doctor</th><th>Precio USD</th><th>Precio Bs</th><th>Estado</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-citas"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, addDoc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE", authDomain: "sistemagestionnegocios-33fef.firebaseapp.com", projectId: "sistemagestionnegocios-33fef", storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app", messagingSenderId: "1070762032731", appId: "1:1070762032731:web:74ad150e739181c8d0897e" }));
        
        let datosCitas = [];
        let medicos = [];

        window.login = async () => {
            try {
                await signInWithEmailAndPassword(getAuth(), document.getElementById("email").value, document.getElementById("pass").value);
                document.getElementById("login-layer").style.display = "none";
                document.getElementById("admin-content").style.display = "block";
                
                const tasaSnap = await getDoc(doc(db, "configuracion", "tasa_bcv"));
                if (tasaSnap.exists()) document.getElementById("tasa-bcv").value = tasaSnap.data().valor;
                
                const mSnap = await getDocs(collection(db, "medicos"));
                medicos = mSnap.docs.map(d => ({id: d.id, ...d.data()}));
                
                cargarCitas();
                setInterval(cargarCitas, 60000);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.guardarTasa = async () => {
            const valor = parseFloat(document.getElementById("tasa-bcv").value);
            await setDoc(doc(db, "configuracion", "tasa_bcv"), { valor: valor });
            alert("Tasa guardada");
            renderizarTabla(datosCitas);
        };

        window.cargarCitas = async () => {
            const snap = await getDocs(collection(db, "citas"));
            datosCitas = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderizarTabla(datosCitas);
        };

        window.renderizarTabla = (datos) => {
            const tasa = parseFloat(document.getElementById("tasa-bcv").value) || 0;
            const tbody = document.getElementById("lista-citas");
            tbody.innerHTML = "";
            datos.forEach(c => {
                const medico = medicos.find(m => m.Nombre === c.doctor) || {};
                const precioUSD = parseFloat(medico.costo) || 0;
                const totalBs = (precioUSD * tasa).toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${c.nombre}</td><td>${c.cedula}</td><td>${c.doctor}</td>
                                <td>$${precioUSD}</td><td>${totalBs} Bs</td>
                                <td class="${c.estado === 'Confirmado' ? 'estado-confirmado' : ''}">${c.estado || 'Pendiente'}</td>
                                <td><button class="btn" onclick="confirmar('${c.id}')">Confirmar</button>
                                    <button class="btn" onclick="cumplir('${c.id}', ${precioUSD}, '${totalBs}')">Cumplido</button>
                                    <button class="btn" onclick="cancelar('${c.id}')">Cancelar</button></td>`;
                tbody.appendChild(tr);
            });
        };

        window.confirmar = async (id) => { await updateDoc(doc(db, "citas", id), { estado: "Confirmado" }); cargarCitas(); };
        
        window.cancelar = async (id) => {
            const cita = datosCitas.find(d => d.id === id);
            await addDoc(collection(db, "citas_canceladas"), { 
                ...cita, 
                fechaCancelacion: new Date().toISOString() 
            });
            await deleteDoc(doc(db, "citas", id));
            cargarCitas();
        };
        
        window.cumplir = async (id, usd, bs) => {
            const cita = datosCitas.find(d => d.id === id);
            await addDoc(collection(db, "historial_citas"), { ...cita, precioUSD: usd, precioBs: bs, fechaCumplido: new Date().toISOString() });
            await deleteDoc(doc(db, "citas", id));
            cargarCitas();
        };

        window.login();
    </script>
</body>
</html>
