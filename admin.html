<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #333; color: white; padding: 10px; text-align: left; }
        td { border: 1px solid #ddd; padding: 10px; }
        .btn-confirm { background-color: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-cancel { background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .confirmado { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Citas Pendientes</h1>
    
    <input type="text" id="buscar" placeholder="Buscar..." onkeyup="filtrarTabla()">
    <button onclick="cargarCitas()">Refrescar Lista</button>

    <table>
        <thead>
            <tr>
                <th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Cita</th><th>Fecha</th><th>Estado</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody id="lista-citas"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        async function verificarAcceso() {
            const user = prompt("Usuario:");
            const pass = prompt("Contraseña:");
            const snap = await getDocs(collection(db, "admin"));
            if (!snap.docs.some(d => d.data().user === user && d.data().pass === pass)) {
                alert("Acceso denegado");
                window.location.href = "index.html";
            } else {
                cargarCitas();
                setInterval(cargarCitas, 60000);
            }
        }

        async function cargarCitas() {
            const tbody = document.getElementById("lista-citas");
            const snap = await getDocs(collection(db, "citas"));
            tbody.innerHTML = "";
            snap.forEach(docSnap => {
                const c = docSnap.data();
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${c.nombre || ''}</td>
                    <td>${c.cedula || ''}</td>
                    <td>${c.telefono || ''}</td>
                    <td>${c.doctor || ''} - ${c.hora || ''}</td>
                    <td>${c.fecha || ''}</td>
                    <td class="${c.confirmado ? 'confirmado' : ''}">${c.confirmado ? 'Confirmado' : 'Pendiente'}</td>
                    <td>
                        ${!c.confirmado ? `<button class="btn-confirm" onclick="confirmarCita('${docSnap.id}')">Confirmar</button>` : ''}
                        <button class="btn-cancel" onclick="cancelarCita('${docSnap.id}')">Cancelar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.confirmarCita = async (id) => {
            await updateDoc(doc(db, "citas", id), { confirmado: true });
            cargarCitas();
        };

        window.cancelarCita = async (id) => {
            if(confirm("¿Cancelar cita?")) {
                await deleteDoc(doc(db, "citas", id));
                cargarCitas();
            }
        };

        window.filtrarTabla = () => {
            const filtro = document.getElementById("buscar").value.toUpperCase();
            const filas = document.getElementById("lista-citas").getElementsByTagName("tr");
            for (let f of filas) {
                f.style.display = f.innerText.toUpperCase().includes(filtro) ? "" : "none";
            }
        };

        window.cargarCitas = cargarCitas;
        window.addEventListener("DOMContentLoaded", verificarAcceso);
    </script>
</body>
</html>
