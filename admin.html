<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>111 Panel de Recepción</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #login-layer { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; }
        #admin-content { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { cursor: pointer; background-color: #f2f2f2; }
        .btn { cursor: pointer; padding: 5px; margin: 2px; }
        .estado-confirmado { background-color: green; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div id="login-layer">
        <h2>Acceso Recepción</h2>
        <input type="email" id="email" placeholder="Correo">
        <input type="password" id="pass" placeholder="Clave">
        <button onclick="login()">Ingresar</button>
    </div>

    <div id="admin-content">
        <h1>Citas Pendientes</h1>
        <input type="text" id="filtro" placeholder="Filtrar por cédula..." onkeyup="filtrar()">
        <button onclick="cargarCitas()">Refrescar Tabla</button>
        <table id="tabla-citas">
            <thead>
                <tr>
                    <th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Cita</th>
                    <th onclick="ordenarPorFecha()">Fecha ↕</th>
                    <th onclick="ordenar('hora')">Hora ↕</th>
                    <th onclick="ordenar('estado')">Estado ↕</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-citas"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE", authDomain: "sistemagestionnegocios-33fef.firebaseapp.com", projectId: "sistemagestionnegocios-33fef", storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app", messagingSenderId: "1070762032731", appId: "1:1070762032731:web:74ad150e739181c8d0897e" });
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let datosCitas = [];
        let ordenAsc = { fecha: true, hora: true, estado: true };

        window.login = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("pass").value);
                document.getElementById("login-layer").style.display = "none";
                document.getElementById("admin-content").style.display = "block";
                cargarCitas();
                setInterval(cargarCitas, 60000);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.cargarCitas = async () => {
            const snap = await getDocs(collection(db, "citas"));
            datosCitas = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderizarTabla(datosCitas);
        };

        window.renderizarTabla = (datos) => {
            const tbody = document.getElementById("lista-citas");
            tbody.innerHTML = "";
            datos.forEach(c => {
                const cedulaFormateada = new Intl.NumberFormat('es-VE').format(c.cedula);
                const fechaFormateada = c.fecha ? c.fecha.split('-').reverse().join('-') : 'N/A';
                const esConfirmado = c.estado === "Confirmado";
                const tr = document.createElement("tr");
                tr.setAttribute("data-cedula", c.cedula);
                tr.innerHTML = `<td>${c.nombre}</td><td>${cedulaFormateada}</td><td>${c.telefono}</td><td>${c.doctor}</td>
                                <td>${fechaFormateada}</td>
                                <td>${c.hora || 'N/A'}</td>
                                <td class="estado ${esConfirmado ? 'estado-confirmado' : ''}">${esConfirmado ? 'Confirmado' : 'Pendiente'}</td>
                                <td>
                                    <button class="btn" onclick="cambiarEstado('${c.id}')">Confirmar</button>
                                    <button class="btn" onclick="cumplirCita('${c.id}')">Cumplido</button>
                                    <button class="btn" onclick="cancelarCita('${c.id}')">Cancelar</button>
                                </td>`;
                tbody.appendChild(tr);
            });
        };

        window.ordenarPorFecha = () => {
            ordenAsc.fecha = !ordenAsc.fecha;
            datosCitas.sort((a, b) => {
                const fechaHoraA = new Date(`${a.fecha}T${a.hora || '00:00'}`);
                const fechaHoraB = new Date(`${b.fecha}T${b.hora || '00:00'}`);
                return ordenAsc.fecha ? fechaHoraA - fechaHoraB : fechaHoraB - fechaHoraA;
            });
            renderizarTabla(datosCitas);
        };

        window.ordenar = (campo) => {
            ordenAsc[campo] = !ordenAsc[campo];
            datosCitas.sort((a, b) => {
                let valA = (a[campo] || "").toLowerCase();
                let valB = (b[campo] || "").toLowerCase();
                return ordenAsc[campo] ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });
            renderizarTabla(datosCitas);
        };

        window.cambiarEstado = async (id) => {
            await updateDoc(doc(db, "citas", id), { estado: "Confirmado" });
            cargarCitas();
        };

        window.cumplirCita = async (id) => {
            const docData = datosCitas.find(d => d.id === id);
            await addDoc(collection(db, "historial_citas"), docData);
            await deleteDoc(doc(db, "citas", id));
            cargarCitas();
        };

        window.cancelarCita = async (id) => {
            await deleteDoc(doc(db, "citas", id));
            cargarCitas();
        };

        window.filtrar = () => {
            const val = document.getElementById("filtro").value;
            document.querySelectorAll("#lista-citas tr").forEach(tr => {
                tr.style.display = tr.getAttribute("data-cedula").includes(val) ? "" : "none";
            });
        };
    </script>
</body>
</html>
