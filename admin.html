<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #333; color: white; padding: 10px; text-align: left; }
        td { border: 1px solid #ddd; padding: 10px; }
        .btn-wa { background-color: #25d366; color: white; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-cancel { background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Citas Pendientes</h1>
    
    <input type="text" id="buscar" placeholder="Buscar (nombre, cédula, etc)" onkeyup="filtrarTabla()">
    <button onclick="cargarCitas()">Refrescar Lista</button>

    <table>
        <thead>
            <tr>
                <th>Nombre y Apellido</th>
                <th>Cédula</th>
                <th>Teléfono</th>
                <th>Cita</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="lista-citas"></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        async function cargarCitas() {
            const tbody = document.getElementById("lista-citas");
            const snap = await getDocs(collection(db, "citas"));
            tbody.innerHTML = "";
            snap.forEach(docSnap => {
                const c = docSnap.data();
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${c.nombre || ''}</td>
                    <td>${c.cedula || ''}</td>
                    <td>${c.telefono || ''}</td>
                    <td>${c.doctor || ''} - ${c.hora || ''}</td>
                    <td>${c.fecha || ''}</td>
                    <td>
                        <button class="btn-wa" onclick="window.open('https://wa.me/${c.telefono}')">WhatsApp</button>
                        <button class="btn-cancel" onclick="cancelarCita('${docSnap.id}')">Cancelar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.cancelarCita = async (id) => {
            if(confirm("¿Estás seguro de cancelar esta cita?")) {
                await deleteDoc(doc(db, "citas", id));
                cargarCitas();
            }
        };

        window.filtrarTabla = () => {
            const filtro = document.getElementById("buscar").value.toUpperCase();
            const filas = document.getElementById("lista-citas").getElementsByTagName("tr");
            for (let f of filas) {
                f.style.display = f.innerText.toUpperCase().includes(filtro) ? "" : "none";
            }
        };

        window.cargarCitas = cargarCitas;
        window.addEventListener("DOMContentLoaded", cargarCitas);
        setInterval(cargarCitas, 60000); // Refresca cada 60 segundos
    </script>
</body>
</html>
