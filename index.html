<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Reservas - Clínica</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f9; }
        .tab { cursor: pointer; padding: 10px 20px; background: #007bff; color: white; margin: 5px; display: inline-block; border-radius: 20px; }
        .slot-btn { padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; margin: 5px; border-radius: 5px; }
        .slot-btn:disabled { background: #adb5bd !important; cursor: not-allowed; }
        .cancel-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 5px; }
        
        /* Modal Estilo */
        #modal-confirmacion { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; }
        #form-cita { display: none; margin-top: 20px; padding: 20px; background: #fff; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>🏥 Sistema de Reservas</h1>
    <nav id="nav-especialidades"></nav>
    <div id="contenedor-principal"></div>

    <div id="form-cita">
        <h3>Completa tu reserva</h3>
        <input type="text" id="nombre-usuario" placeholder="Tu nombre completo"><br><br>
        <input type="text" id="tel-usuario" placeholder="Tu teléfono de contacto"><br><br>
        <button id="btn-confirmar" class="slot-btn">Confirmar Reserva</button>
    </div>

    <!-- Modal de Confirmación -->
    <div id="modal-confirmacion">
        <div class="modal-content">
            <h2>¡Cita Reservada con Éxito! ✨</h2>
            <p>Muchas gracias por confiar en nosotros. Tu solicitud ha sido recibida correctamente y nuestro equipo se pondrá en contacto pronto para confirmarla.</p>
            <button onclick="location.reload()" class="slot-btn">Aceptar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        let datosMedicos = [], citasReservadas = [], claveAdmin = "";

        async function inicializar() {
            const configSnap = await getDoc(doc(db, "configuracion", "datos_clinica"));
            if (configSnap.exists()) claveAdmin = configSnap.data().clave_cancelacion;

            const [medicosSnap, citasSnap] = await Promise.all([getDocs(collection(db, "medicos")), getDocs(collection(db, "citas"))]);
            medicosSnap.forEach(d => datosMedicos.push(d.data()));
            citasReservadas = citasSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const especialidades = Array.from(new Set(datosMedicos.map(m => m.especialidad)));
            const nav = document.getElementById("nav-especialidades");
            especialidades.forEach(esp => {
                const btn = document.createElement("div");
                btn.className = "tab"; btn.innerText = esp;
                btn.onclick = () => filtrar(esp);
                nav.appendChild(btn);
            });
        }

        window.filtrar = (esp) => {
            const cont = document.getElementById("contenedor-principal");
            cont.innerHTML = `<h2>Médicos en ${esp}</h2>`;
            datosMedicos.filter(m => m.especialidad === esp).forEach(medico => {
                const div = document.createElement("div");
                div.innerHTML = `<h3>Dr. ${medico.Nombre}</h3>`;
                for (const [dia, horas] of Object.entries(medico.horarios)) {
                    div.innerHTML += `<div><strong>${dia}:</strong> ` + horas.map(h => {
                        const cita = citasReservadas.find(c => c.doctor === medico.Nombre && c.dia === dia && c.hora === h);
                        return cita 
                            ? `<button class="slot-btn" disabled>${h}</button><button class="cancel-btn" onclick="cancelar('${cita.id}')">X</button>`
                            : `<button class="slot-btn" onclick="abrirFormulario('${h}', '${medico.Nombre}', '${dia}')">${h}</button>`;
                    }).join(' ') + `</div><br>`;
                }
                cont.appendChild(div);
            });
        };

        window.abrirFormulario = (hora, doctor, dia) => {
            window.citaSeleccionada = { hora, doctor, dia };
            document.getElementById("form-cita").style.display = "block";
        };

        window.cancelar = async (id) => {
            const clave = prompt("Ingrese la clave de administrador:");
            if (clave === claveAdmin) {
                await deleteDoc(doc(db, "citas", id));
                alert("Cita cancelada."); location.reload();
            }
        };

        document.getElementById("btn-confirmar").onclick = async () => {
            const nombre = document.getElementById("nombre-usuario").value;
            const tel = document.getElementById("tel-usuario").value;
            if(!nombre || !tel) return alert("Por favor completa los campos");
            
            await addDoc(collection(db, "citas"), { ...window.citaSeleccionada, paciente: nombre, telefonoPaciente: tel });
            document.getElementById("modal-confirmacion").style.display = "flex";
            document.getElementById("form-cita").style.display = "none";
        };

        inicializar();
    </script>
</body>
</html>
