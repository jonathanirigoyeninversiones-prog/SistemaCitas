<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Reservas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .tab { cursor: pointer; padding: 10px 20px; background: #ddd; margin: 5px; display: inline-block; border-radius: 5px; }
        .accordion { margin: 10px 0; background: white; padding: 10px; border: 1px solid #ccc; }
        .slot-btn { padding: 8px 15px; background: #4CAF50; color: white; border: none; cursor: pointer; margin: 5px; }
        #form-cita { display: none; margin-top: 20px; padding: 20px; background: #fff; border: 2px solid #4CAF50; }
    </style>
</head>
<body>
    <h1>Reservar Cita</h1>
    <nav id="nav-especialidades"></nav>
    <div id="contenedor-principal"></div>

    <div id="form-cita">
        <h3>Completar Reserva</h3>
        <input type="text" id="nombre-usuario" placeholder="Nombre completo"><br><br>
        <input type="text" id="tel-usuario" placeholder="Teléfono"><br><br>
        <button id="btn-confirmar">Confirmar Cita</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        let datosMedicos = [];
        let citaSeleccionada = {};

        async function cargarDatos() {
            const querySnapshot = await getDocs(collection(db, "medicos"));
            const especialidades = new Set();
            querySnapshot.forEach(doc => {
                const data = doc.data();
                datosMedicos.push(data);
                especialidades.add(data.especialidad);
            });
            renderizarTabs(Array.from(especialidades));
        }

        function renderizarTabs(lista) {
            const nav = document.getElementById("nav-especialidades");
            lista.forEach(esp => {
                const btn = document.createElement("div");
                btn.className = "tab";
                btn.innerText = esp;
                btn.onclick = () => filtrar(esp);
                nav.appendChild(btn);
            });
        }

        function filtrar(esp) {
            const cont = document.getElementById("contenedor-principal");
            cont.innerHTML = `<h2>Médicos en ${esp}</h2>`;
            datosMedicos.filter(m => m.especialidad === esp).forEach(medico => {
                const div = document.createElement("div");
                div.innerHTML = `<h3>Dr. ${medico.Nombre || medico.nombre}</h3>`;
                if (medico.horarios) {
                    for (const [dia, horas] of Object.entries(medico.horarios)) {
                        div.innerHTML += `<details class="accordion"><summary>${dia}</summary>
                        <div class="slots">${horas.map(h => `<button class="slot-btn" onclick="abrirFormulario('${h}', '${medico.Nombre}', '${dia}')">${h}</button>`).join('')}</div>
                        </details>`;
                    }
                }
                cont.appendChild(div);
            });
        }

        window.abrirFormulario = (hora, doctor, dia) => {
            citaSeleccionada = { hora, doctor, dia };
            document.getElementById("form-cita").style.display = "block";
        };

        document.getElementById("btn-confirmar").onclick = async () => {
            const citasRef = collection(db, "citas");
            const q = query(citasRef, 
                where("doctor", "==", citaSeleccionada.doctor),
                where("dia", "==", citaSeleccionada.dia),
                where("hora", "==", citaSeleccionada.hora)
            );

            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                alert("¡Lo siento! Esta hora ya ha sido reservada.");
            } else {
                await addDoc(citasRef, {
                    ...citaSeleccionada,
                    paciente: document.getElementById("nombre-usuario").value,
                    telefono: document.getElementById("tel-usuario").value
                });
                alert("¡Cita reservada con éxito!");
                location.reload();
            }
        };

        cargarDatos();
    </script>
</body>
</html>
