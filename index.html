<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Citas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .tab { cursor: pointer; padding: 10px 20px; background: #007bff; color: white; margin: 5px; display: inline-block; border-radius: 20px; }
        .slot-btn { padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; margin: 5px; border-radius: 5px; }
        .slot-btn:disabled { background: #adb5bd !important; cursor: not-allowed; }
        #modal-confirmacion { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; }
        #form-cita { display: none; margin-top: 20px; padding: 20px; background: #fff; border-radius: 10px; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <h1>🏥 Reservar Cita</h1>
    <nav id="nav-especialidades"></nav>
    <div id="contenedor-principal"></div>

    <div id="form-cita">
        <h3>Completar Reserva</h3>
        <input type="date" id="fecha-cita">
        <input type="text" id="nombre" placeholder="Nombres">
        <input type="text" id="apellido" placeholder="Apellidos">
        <input type="number" id="cedula" placeholder="Cédula">
        <input type="tel" id="telefono" placeholder="Teléfono">
        <button id="btn-confirmar" class="slot-btn">Confirmar Reserva</button>
    </div>

    <div id="modal-confirmacion">
        <div class="modal-content">
            <h2>¡Cita Reservada! ✨</h2>
            <button onclick="location.reload()" class="slot-btn">Aceptar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        let datosMedicos = [], citasReservadas = [];

        async function inicializar() {
            const [mSnap, cSnap] = await Promise.all([getDocs(collection(db, "medicos")), getDocs(collection(db, "citas"))]);
            mSnap.forEach(d => datosMedicos.push({id: d.id, ...d.data()}));
            citasReservadas = cSnap.docs.map(d => d.data());
            // ... (lógica de botones igual)
        }

        document.getElementById("btn-confirmar").onclick = async () => {
            const fecha = document.getElementById("fecha-cita").value;
            const data = { /* ... tus datos ... */ fecha, ...window.citaSeleccionada };
            
            // VERIFICACIÓN: ¿Ya existe una cita en esa fecha y hora?
            const existe = citasReservadas.find(c => c.fecha === fecha && c.hora === data.hora && c.doctor === data.doctor);
            if(existe) return alert("¡Esta cita ya fue tomada para esa fecha!");

            await addDoc(collection(db, "citas"), data);
            document.getElementById("modal-confirmacion").style.display = "flex";
            document.getElementById("form-cita").style.display = "none";
        };
        // ... (resto del código)
    </script>
</body>
</html>
