<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Reservas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .tab { cursor: pointer; padding: 10px 20px; background: #ddd; margin: 5px; display: inline-block; border-radius: 5px; }
        .accordion { margin: 10px 0; background: white; padding: 10px; border: 1px solid #ccc; }
        .slot-btn { padding: 8px 15px; background: #4CAF50; color: white; border: none; cursor: pointer; margin: 5px; }
        .slot-btn:disabled { background: #888 !important; cursor: not-allowed; }
        #form-cita { display: none; margin-top: 20px; padding: 20px; background: #fff; border: 2px solid #4CAF50; }
    </style>
</head>
<body>
    <h1>Reservar Cita</h1>
    <nav id="nav-especialidades"></nav>
    <div id="contenedor-principal"></div>

    <div id="form-cita">
        <h3>Completar Reserva</h3>
        <input type="text" id="nombre-usuario" placeholder="Nombre completo"><br><br>
        <input type="text" id="tel-usuario" placeholder="Teléfono"><br><br>
        <button id="btn-confirmar">Confirmar Cita</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        let datosMedicos = [];
        let citasReservadas = [];
        let citaSeleccionada = {};

        async function inicializar() {
            const medicosSnap = await getDocs(collection(db, "medicos"));
            const citasSnap = await getDocs(collection(db, "citas"));
            medicosSnap.forEach(doc => datosMedicos.push(doc.data()));
            citasSnap.forEach(doc => citasReservadas.push(doc.data()));
            renderizarTabs(Array.from(new Set(datosMedicos.map(m => m.especialidad))));
        }

        function renderizarTabs(lista) {
            const nav = document.getElementById("nav-especialidades");
            lista.forEach(esp => {
                const btn = document.createElement("div");
                btn.className = "tab";
                btn.innerText = esp;
                btn.onclick = () => filtrar(esp);
                nav.appendChild(btn);
            });
        }

        function filtrar(esp) {
            const cont = document.getElementById("contenedor-principal");
            cont.innerHTML = `<h2>Médicos en ${esp}</h2>`;
            datosMedicos.filter(m => m.especialidad === esp).forEach(medico => {
                const div = document.createElement("div");
                div.innerHTML = `<h3>Dr. ${medico.Nombre}</h3>`;
                for (const [dia, horas] of Object.entries(medico.horarios)) {
                    div.innerHTML += `<details class="accordion"><summary>${dia}</summary>
                    <div class="slots">${horas.map(h => {
                        const ocupada = citasReservadas.find(c => c.doctor === medico.Nombre && c.dia === dia && c.hora === h);
                        return `<button class="slot-btn" ${ocupada ? 'disabled' : ''} onclick="abrirFormulario('${h}', '${medico.Nombre}', '${dia}')">${h}</button>`;
                    }).join('')}</div></details>`;
                }
                cont.appendChild(div);
            });
        }

        window.abrirFormulario = (hora, doctor, dia) => {
            citaSeleccionada = { hora, doctor, dia };
            document.getElementById("form-cita").style.display = "block";
        };

        document.getElementById("btn-confirmar").onclick = async () => {
            const nombre = document.getElementById("nombre-usuario").value;
            const tel = document.getElementById("tel-usuario").value;
            
            await addDoc(collection(db, "citas"), { ...citaSeleccionada, paciente: nombre, telefono: tel });
            
            const mensaje = `Hola, quiero confirmar mi cita:%0A- Doctor: ${citaSeleccionada.doctor}%0A- Día: ${citaSeleccionada.dia}%0A- Hora: ${citaSeleccionada.hora}%0A- Paciente: ${nombre}%0A- Teléfono: ${tel}`;
            
            window.location.href = `https://wa.me/584120181456?text=${mensaje}`;
        };

        inicializar();
    </script>
</body>
</html>
