<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Citas Médicas</title>
</head>
<body>
    <h1>Mis Médicos en Firebase</h1>
    <ul id="lista-medicos"></ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e",
            measurementId: "G-7NC0YQ2XEG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarMedicos() {
            const lista = document.getElementById("lista-medicos");
            const querySnapshot = await getDocs(collection(db, "medicos"));
            
            querySnapshot.forEach((doc) => {
                const medico = doc.data();
                // Aquí el código detecta si escribiste Nombre o nombre
                const nombreDelMedico = medico.Nombre || medico.nombre || "Sin nombre";
                const especialidadDelMedico = medico.especialidad || "Sin especialidad";
                
                lista.innerHTML += `<li>${nombreDelMedico} - ${especialidadDelMedico}</li>`;
            });
        }

        cargarMedicos();
    </script>
</body>
</html>
