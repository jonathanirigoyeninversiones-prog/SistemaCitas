<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Citas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        /* Contenedor del precio añadido */
        #bcv-container { position: absolute; top: 10px; right: 10px; background: #fff; padding: 10px; border-radius: 8px; font-weight: bold; border: 1px solid #ccc; }
        .tab { cursor: pointer; padding: 10px 20px; background: #007bff; color: white; margin: 5px; display: inline-block; border-radius: 20px; border: none; }
        .slot-btn { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; margin: 5px; border-radius: 5px; }
        .slot-btn:disabled { background: #ccc; cursor: not-allowed; }
        input { display: block; margin: 10px 0; padding: 8px; width: 250px; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: white; margin: 15% auto; padding: 30px; border-radius: 15px; width: 80%; max-width: 350px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-modal { padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-error { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <div id="bcv-container">Precio $ BCV: <span id="precio-bcv">Cargando...</span></div>
    
    <h1>🏥 Reserva tu Cita</h1>
    <nav id="nav-especialidades"></nav>
    <div id="seccion-seleccion"></div>

    <div id="modalGracias" class="modal">
        <div class="modal-content">
            <h2>¡Cita Reservada!</h2>
            <p>Nuestro equipo se pondrá en contacto pronto.</p>
            <button class="btn-modal btn-success" onclick="document.getElementById('modalGracias').style.display='none'">Aceptar</button>
        </div>
    </div>

    <div id="modalNoDisponible" class="modal">
        <div class="modal-content">
            <h2 style="color: #dc3545;">Fecha no válida</h2>
            <p id="msgError">El profesional no labora en esta fecha o la fecha ya pasó.</p>
            <button class="btn-modal btn-error" onclick="document.getElementById('modalNoDisponible').style.display='none'">Aceptar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyAOblSllwV6HnkrOv-DuIDjqJo6tuPcnzE",
            authDomain: "sistemagestionnegocios-33fef.firebaseapp.com",
            projectId: "sistemagestionnegocios-33fef",
            storageBucket: "sistemagestionnegocios-33fef.firebasestorage.app",
            messagingSenderId: "1070762032731",
            appId: "1:1070762032731:web:74ad150e739181c8d0897e"
        }));

        let medicos = [];
        const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

        // Función corregida para obtener el precio del BCV
        async function obtenerPrecioBCV() {
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                const data = await response.json();
                document.getElementById('precio-bcv').innerText = "Bs. " + data.promedio.toFixed(2);
            } catch (error) {
                document.getElementById('precio-bcv').innerText = "Reintentando...";
                setTimeout(obtenerPrecioBCV, 5000);
            }
        }

        async function init() {
            const snap = await getDocs(collection(db, "medicos"));
            medicos = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const nav = document.getElementById("nav-especialidades");
            const especialidades = [...new Set(medicos.map(m => m.especialidad))];
            especialidades.forEach(esp => {
                const b = document.createElement("button");
                b.className = "tab"; b.innerText = esp;
                b.onclick = () => mostrarMedicos(esp);
                nav.appendChild(b);
            });
        }

        window.mostrarMedicos = (esp) => {
            const cont = document.getElementById("seccion-seleccion");
            cont.innerHTML = "<h3>Selecciona médico:</h3>";
            medicos.filter(m => m.especialidad === esp).forEach(m => {
                const b = document.createElement("button");
                b.className = "slot-btn"; b.innerText = "Dr. " + m.Nombre;
                b.onclick = () => {
                    const hoy = new Date().toISOString().split('T')[0];
                    cont.innerHTML = `<h3>Dr. ${m.Nombre}</h3><input type="date" id="fecha-selector" min="${hoy}">`;
                    document.getElementById("fecha-selector").onchange = (e) => mostrarHoras(m.id, e.target.value);
                };
                cont.appendChild(b);
            });
        };

        window.mostrarHoras = async (id, fecha) => {
            const ahora = new Date();
            const hoyStr = ahora.toISOString().split('T')[0];
            
            if (fecha < hoyStr) {
                document.getElementById("msgError").innerText = "No puedes seleccionar fechas pasadas.";
                document.getElementById("modalNoDisponible").style.display = "block";
                return;
            }

            const medico = medicos.find(m => m.id === id);
            const d = new Date(fecha + 'T00:00:00');
            const diaNombre = dias[d.getDay()];
            const horas = medico[diaNombre];

            if (!horas || horas.length === 0) {
                document.getElementById("msgError").innerText = "El profesional no labora este día.";
                document.getElementById("modalNoDisponible").style.display = "block";
                return;
            }

            const q = query(collection(db, "citas"), where("doctor", "==", medico.Nombre), where("fecha", "==", fecha));
            const snap = await getDocs(q);
            const ocupadas = snap.docs.map(d => d.data().hora);
            
            const cont = document.getElementById("seccion-seleccion");
            cont.innerHTML = `<h3>Dr. ${medico.Nombre}</h3>
                              <input type="date" id="fecha-selector" value="${fecha}">
                              <input type="text" id="nombre-paciente" placeholder="Nombre y Apellido" required>
                              <input type="text" id="cedula-paciente" placeholder="Cédula (Máx 8 números, no inicia en 0)" required>
                              <input type="tel" id="telefono-paciente" placeholder="Teléfono (Ej: 04141234567)" required>
                              <h4>${diaNombre}</h4>`;
            
            document.getElementById("fecha-selector").onchange = (e) => mostrarHoras(id, e.target.value);
            
            horas.forEach(h => {
                const b = document.createElement("button");
                b.className = "slot-btn"; b.innerText = h;
                
                if (ocupadas.includes(h)) b.disabled = true;
                else if (fecha === hoyStr) {
                    const horaTurno = parseInt(h.split(':')[0]);
                    if (ahora.getHours() >= horaTurno) b.disabled = true;
                }

                b.onclick = async () => {
                    const nombre = document.getElementById("nombre-paciente").value;
                    const cedula = document.getElementById("cedula-paciente").value;
                    const telefono = document.getElementById("telefono-paciente").value.trim();
                    
                    const regexCedula = /^[1-9]\d{0,7}$/;
                    const regexTel = /^\d{11}$/;

                    if(!regexCedula.test(cedula)) return alert("Cédula inválida: Solo números (máximo 8) y no debe comenzar con 0.");
                    if(!regexTel.test(telefono)) return alert("Teléfono inválido: Debe contener exactamente 11 dígitos.");

                    await addDoc(collection(db, "citas"), { doctor: medico.Nombre, dia: diaNombre, fecha: fecha, hora: h, nombre: nombre, cedula: cedula, telefono: telefono });
                    
                    document.getElementById("nombre-paciente").value = "";
                    document.getElementById("cedula-paciente").value = "";
                    document.getElementById("telefono-paciente").value = "";
                    document.getElementById("modalGracias").style.display = "block";
                    mostrarHoras(id, fecha);
                };
                cont.appendChild(b);
            });
        };

        window.addEventListener("DOMContentLoaded", () => {
            init();
            obtenerPrecioBCV();
        });
    </script>
</body>
</html>
